[project]
name = "wow-trial"
version = "5.1.0"
description = "WCL combat-log ETL and coaching-report pipeline (educational use)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "pyyaml>=6.0",
  "pydantic>=2.0.0",
  "httpx>=0.25.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
